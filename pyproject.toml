[project]
name = "d-transfert"
version = "0.1.0"
description = "D-Transfert backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.2",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "passlib[argon2]>=1.7.4",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "redis>=5.0.0",
    "sentry-sdk>=2.0.0",
    # Requêtes HTTP sortantes vers l'API Twilio (SMS/WhatsApp) — voir
    # notification_channel_service.py. Aussi utilisé par les tests (TestClient ASGI).
    "httpx>=0.27.0",
    # Génération des exports PDF des rapports — pure Python, pas de dépendance système
    # (contrairement à weasyprint/cairo), ce qui garde le Dockerfile slim.
    "reportlab>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["app/tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Pyflakes (F) uniquement : F821 (nom non défini) est la règle qui aurait détecté le bug
# _other_party avant merge. Volontairement pas de règles de style (E/W, line-length...) —
# le but est d'attraper des bugs réels, pas de réécrire le style existant du projet.
select = ["F"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
